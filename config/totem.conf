# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n
CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=34

# ---------------------------- bluetooth --------------------------
# ZMK's own "planned to become the default" connection-stability switch.
# Today it forces CONFIG_BT_CTLR_PHY_2M=n; the 2Mbps PHY is the usual suspect
# behind "host thinks it is still connected but nothing arrives" on macOS and
# Windows.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# The XIAO's on-board ceramic antenna is weak. +8 dBm is the nRF52840 maximum
# and is what ZMK ships on its own boards (Glove80, Adv360 Pro). Costs a little
# battery, buys a lot of margin -- both halves to each other and to the host.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Deep sleep drops the BLE link. On wake the host can keep showing the keyboard
# as connected for a few seconds while nothing gets through. If the dropouts
# happen after leaving the keyboard alone for a while, raise this or set
# CONFIG_ZMK_SLEEP=n to rule it out.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Diagnostic only: if the dropouts survive everything above, a flaky 32.768 kHz
# crystal is the remaining hardware cause. Uncommenting this falls back to the
# internal RC oscillator -- less accurate, slightly worse battery, but it will
# tell you whether the crystal is the problem.
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

