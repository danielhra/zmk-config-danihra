# Turn on logging, and set ZMK logging to debug output
CONFIG_ZMK_USB_LOGGING=n

# ---------------------------- bluetooth --------------------------
# ZMK's own "planned to become the default" connection-stability switch.
# Today it forces CONFIG_BT_CTLR_PHY_2M=n; the 2Mbps PHY is the usual suspect
# behind "host thinks it is still connected but nothing arrives" on macOS and
# Windows.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# The XIAO's on-board ceramic antenna is weak, so this sits above the 0 dBm
# default. +8 is the nRF52840 maximum and what ZMK ships on its own boards,
# but transmit power is the one setting here that costs battery, so this is
# stepped down to +4 -- half the margin at a fraction of the current. If the
# dropouts come back, CONFIG_BT_CTLR_TX_PWR_PLUS_8 is the way back.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Deep sleep disconnects BLE and powers down peripherals, so time spent idle
# but still connected is the largest avoidable drain. 5 minutes, down from 30
# (ZMK's own default is 15). The cost is more sleep/wake cycles and therefore
# more reconnections -- if reconnecting proves unreliable, raise this before
# blaming the radio settings.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Diagnostic only: if the dropouts survive everything above, a flaky 32.768 kHz
# crystal is the remaining hardware cause. Uncommenting this falls back to the
# internal RC oscillator -- less accurate, slightly worse battery, but it will
# tell you whether the crystal is the problem.
# CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

