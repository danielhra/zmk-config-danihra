# Central only -- this is the half that pairs with hosts. src/ble.c is compiled
# for the central alone, so host pairing policy belongs here rather than in
# totem.conf, which applies to both halves.

# BT_MAX_PAIRED - 1 peripheral = 3 host profiles, matching the
# &bt BT_SEL 0/1/2 bindings on the util layer.
CONFIG_BT_MAX_CONN=4
CONFIG_BT_MAX_PAIRED=4

# Lets a host re-pair over its own existing bond. Without it ZMK refuses any
# pairing request to a profile that already holds a bond, which is why a host
# that has forgotten the keyboard cannot get back in until the profile is
# cleared on the keyboard too. Implies ZMK_BLE_PASSKEY_ENTRY, which is what
# keeps the overwrite from being anonymous -- pairing now asks for a 6-digit
# code typed on the keyboard.
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=y
