# Peripheral only.

# A split peripheral cannot be a USB HID endpoint, so ZMK_USB is forced to n
# here -- but USB_DEVICE_STACK stays on from the board defconfig, and usb.c is
# compiled whenever that is set. It then calls usb_enable() at boot via
# SYS_INIT, powering up the USB device peripheral with no class registered.
#
# Turning it off measurably helped: the right half's overnight drain went from
# ~10% to ~5% against the left half's ~1%, and it saved 13 KB of flash and 9 KB
# of RAM that this half had no use for.
#
# It did not close the gap, though, so the original theory -- that this was
# making zmk_pm_suspend_devices() fail and silently skip sys_poweroff() -- is
# at best only part of the story. The remaining asymmetry is most likely the
# cell itself: this half never terminates charging at 100%, and its voltage
# snaps up ~90 mV within minutes of coming off load, which is what a worn cell
# with high internal resistance does. That needs a replacement cell, not a
# config change.
CONFIG_USB_DEVICE_STACK=n

# Dropping the USB stack removes the CDC ACM device that the console was bound
# to, and uart_console.c then falls back to the DT chosen console -- which is
# xiao_serial, disabled by ZMK's board DTS. That fails to link. This half has
# no usable log path anyway once USB is gone, so take the console with it.
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
